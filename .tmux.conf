set -g default-shell /bin/zsh
set -g display-panes-time 10000
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-key -M' 'copy-mode -e'"
set -g history-limit 1000000
set -g word-separators ' '
set -sg escape-time 0
bind r source-file ~/.tmux.conf \; display-message "Reloaded .tmux.conf!!"
set -g renumber-window on
set -g status-interval 5

# Change Prefix
set -g prefix C-q
unbind C-b
bind C-t send-prefix

# Session operations
bind -n M-C new-session -c ~
bind -n M-K switch-client -n
bind -n M-J switch-client -p

# Window operations
bind C-c new-window
bind C-t last-window
bind -n M-w new-window -c "#{pane_current_path}"
bind -n M-L next-window
bind -n M-H previous-window
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Pane operations
unbind |
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n -r M-h select-pane -L
bind -n -r M-j select-pane -D
bind -n -r M-k select-pane -U
bind -n -r M-l select-pane -R
bind -n M-o select-pane -t :.+
bind -n M-o select-pane -t :.-
bind -n M-z resize-pane -Z
bind -r C-o select-pane -t :.+ \; refresh-client
bind -r o display-panes \; select-pane -t :.+ \; refresh-client
bind S setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized, on, off}"

# Copy mode operations
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Y send -X copy-line
bind C-p paste-buffer

# Enable 256 color
set -g default-terminal "screen-256color"
# set -g default-terminal "xterm-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -g terminal-overrides "xterm:colors=256"

# Add color theme
# source-file ~/.tmux/iceberg_minimal.tmux.conf
# source-file ~/.tmux/tmuxcolors-dark.conf

# Statusbar style
set -g status-position top
set -g status-bg default
set -g status-fg default
set -g status-justify left
set -g base-index 1
set -g pane-base-index 1
set -g status-left-length 90
set -g status-right-length 90
set -g status-left '#{prefix_highlight} #h > #[fg=Yellow1]#S#[default] > '
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_empty_prompt '     Tmux     '
set -g @prefix_highlight_copy_prompt '    Copy    '
set -g @prefix_highlight_prefix_prompt '    Wait    '
set -g @prefix_highlight_sync_prompt '    Sync    '
set -g @prefix_highlight_empty_attr 'fg=black,bg=green'
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'blue'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=red'
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format "#[fg=#141414,bg=#849cc4] #I:#W #[default]"
set -g status-right '#[fg=white]%Y-%m-%d %H:%M #[bg=black]#{cpu_fg_color} CPU: #{cpu_percentage} #{ram_fg_color}RAM: #{ram_percentage} #[default]'
set -g @cpu_medium_thresh "30"
set -g @ram_medium_thresh "50"
set -g @cpu_high_thresh "80"
set -g @ram_high_thresh "80"

# Pane border style
set -g pane-border-status bottom
set -g pane-border-format "#[fg=white] #P: #(~/.tmux/scripts/pane-border #{pane_current_path}) #[default]"
set -g pane-active-border-style fg=blue

# Pane layout
bind -n M-i next-layout
set -g main-pane-width 160
set -g main-pane-height 30

# Tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'knakayama/tmux-newline-detector'
set -g @plugin 'laktak/extrakto'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '180'

# Initialize Tmux plugin manager (keep this line at the very bottom of tmux.conf)
# 1. git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# 2. <prefix> I

run '~/.tmux/plugins/tpm/tpm'
